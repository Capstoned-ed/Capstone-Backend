services:
  - type: web
    name: regquest-backend
    env: python
    buildCommand: cd backend && ./build.sh
    startCommand: cd backend && gunicorn _core.wsgi:application --workers 3 --threads 2 --worker-class gthread --worker-tmp-dir /dev/shm --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

